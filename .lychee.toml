# Build checks HTML and internal links. This scheduled job checks external URLs.
scheme = ["http", "https"]
no_ignore = true # Include generated _site files despite .gitignore.
no_progress = true
include_fragments = "anchor-only"
max_concurrency = 8
host_concurrency = 2
timeout = 60
max_retries = 3
retry_wait_time = 10
# Lychee sends GET with gzip support and respects Retry-After automatically.

# Preserve the existing GitHub anchor rewrite.
remap = ['^(https://github\.com/.*)#.*$ $1']

exclude = [
    # These URLs are checked against the generated site by the Build workflow.
    '^https://missing-semester-kr\.github\.io/',

    # Existing exact-URL exceptions; root URLs normalize to a trailing slash.
    '^https://crates\.io/$',
    '^https://dtrace\.org/about/$',
    '^https://blogs\.oracle\.com/linux/strace-the-sysadmins-microscope-v2$',
    '^https://www\.vmware\.com/$',
    '^https://fossbytes\.com/enable-full-disk-encryption-windows-10/$',
    '^http://debian\.xfree\.com\.ar/debian-cd/current/amd64/iso-cd/$',
    '^https://www\.springboard\.com/blog/data-science/free-public-data-sets-data-science-project/$',
    '^https://ucr\.fbi\.gov/crime-in-the-u\.s/2016/crime-in-the-u\.s\.-2016/topic-pages/tables/table-1$',
    '^https://www\.autohotkey\.com/$',
    '^https://rsync\.samba\.org/$',
    '^https://fidoalliance\.org/$',
    '^https://wiki\.mozilla\.org/Security/Server_Side_TLS$',
    '^https://undo\.io/resources/reverse-debugging-whitepaper/$',
    '^https://www\.virtualbox\.org/$',
    '^https://pdw\.ex-parrot\.com/iftop/$',
    '^https://whereis\.mit\.edu/\?go=35$',
    '^https://pdw\.ex-parrot\.com/Mail-RFC822-Address\.html$',
    '^https://zsh\.sourceforge\.io/Guide/zshguide04\.html$',
    '^https://leetcode\.com/$',
    '^https://www\.npmjs\.com/$',
    '^https://www\.vagrantup\.com/$',
    '^https://www\.nongnu\.org/atool/$',

    # Existing host exceptions; no additional external hosts are excluded.
    '^https://www\.brendangregg\.com/',
    '^https://help\.github\.com/',
    '^https://linux\.die\.net/man/',
    '^https://www\.reddit\.com/',
    '^https://stackoverflow\.com/',
    '^https://.*\.stackoverflow\.com/',
    '^https://.*\.stackexchange\.com/',
    '^https://medium\.com/',
    '^https://www\.gnu\.org/',
    '^https://openai\.com/',
    # Fandom challenges automated requests; see issue #40 and PR #44.
    '^https://vim\.fandom\.com/',
]
