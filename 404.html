<h1 class="title">404: 페이지를 찾을 수 없습니다</h1>

<p>보통 잘못된 URL을 입력했거나 그런 링크를 따라왔을 때 이 화면이 나타납니다. 드물게 페이지가 새 URL로 옮겨졌을 때도 나타날 수 있습니다(되도록 주소를 옮기지 않으려 노력하고 있습니다).</p>

<p>HTTP 404 오류에 관한 일반적인 설명은 <a href="https://en.wikipedia.org/wiki/HTTP_404">위키백과의 HTTP 404 문서</a>에서 볼 수 있습니다.</p>
