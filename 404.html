<h1 class="title">404: 페이지를 찾을 수 없습니다</h1>

<p>대개는 잘못된 주소를 입력했거나 잘못된 링크를 따라왔다는 뜻입니다. 드물게는 페이지 주소가 바뀌었을 수도 있습니다. 다만 그런 일은 되도록 피하려고 합니다.</p>

<p>HTTP 404 오류에 관한 설명은 <a href="https://en.wikipedia.org/wiki/HTTP_404">위키백과</a>에서 볼 수 있습니다.</p>
