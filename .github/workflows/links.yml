name: Links
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if docker run --rm --entrypoint ruby \
              --volume "$PWD:/site" --workdir /site --env GITHUB_TOKEN \
              anishathalye/proof-html:2.2.5 .github/scripts/check-links.rb \
              2>&1 | tee -a link-check.log; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          exit "$status"
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: link-check.log
          if-no-files-found: ignore
