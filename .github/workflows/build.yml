name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Check HTML and internal links
        uses: anishathalye/proof-html@v2
        with:
          directory: ./_site
          enforce_https: false
          disable_external: true
          swap_urls: |
            {"^https:\\/\\/missing-semester-kr\\.github\\.io/": "/"}
